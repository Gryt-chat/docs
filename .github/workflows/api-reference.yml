name: API reference

# Three of the pages under content/docs/build are generated from doc comments
# in server, client and bot. Editing one by hand is undone by the next run.

# Runs the superproject's check here, on the pull request that causes it, rather
# than leaving it to the nightly sweep over there. GRYT-1100.

on:
  pull_request:
    paths:
      - content/docs/build/**
      - .github/workflows/api-reference.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    uses: Gryt-chat/.github/.github/workflows/api-reference.yml@main
    with:
      component: docs
