name: CI self-test

# Fires the Discord #ci alert path on demand, so it can be proven without waiting for
# something to break. Run it with outcome fail, then pass, to exercise both messages.

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Whether this run should fail or pass
        required: true
        type: choice
        default: fail
        options:
          - fail
          - pass

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Exit with the requested outcome
        env:
          OUTCOME: ${{ inputs.outcome }}
        run: |
          set -euo pipefail

          if [ "$OUTCOME" = "fail" ]; then
            echo "Failing on purpose so the Discord #ci notifier has something to report."
            exit 1
          fi

          echo "Passing on purpose. If the previous run failed, #ci gets a recovery message."
