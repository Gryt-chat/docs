name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matching the Dockerfile rather than the newest Node, so a build that
          # passes here is a build that passes in the image.
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile

      # `next build` type-checks as part of building and there is no separate
      # typecheck script, so this is both.
      - run: yarn build

  # docs.gryt.chat is this Dockerfile. Its own job, because the image installs
  # everything it needs and has nothing to take from the one above.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
